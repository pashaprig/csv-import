<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Підготовка імпорту для DELTA: парсинг текстових донесень, вибір колонок та експорт CSV." />
  <meta name="theme-color" content="#08131d" />
  <title>CSV Project</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <article class="csv">
    <div class="csv__hero">
      <div>
        <p class="csv__eyebrow">Система підготовки даних</p>
        <h1 class="csv__title">Підготовка імпорту для DELTA</h1>
        <p class="csv__subtitle">Швидка підготовка, валідація та експорт CSV для оперативних даних.</p>
      </div>
      <label class="csv__theme-toggle" for="themeToggle">
        <input type="checkbox" id="themeToggle" />
        <span>Світла тема</span>
      </label>
    </div>

    <div class="csv__panel">
      <form class="csv__form">
        <div class="csv__wrapper">
          <div class="csv__input-card">
            <div class="csv__input-header">
              <div class="csv__field-label-wrap">
                <label class="csv__field-label" for="inputText">Вхідний текст</label>
                <button class="csv__info-button" type="button" id="inputHelpButton" aria-label="Показати інструкцію парсингу">i</button>
              </div>
              <div class="csv__mode-switches" role="radiogroup" aria-label="Режим обробки">
                <label class="csv__mode-option" for="modePoint">
                  <input type="radio" name="processingMode" id="modePoint" value="point" checked />
                  <span>Точки</span>
                </label>
                <label class="csv__mode-option" for="modeRoute">
                  <input type="radio" name="processingMode" id="modeRoute" value="route" />
                  <span>Маршрути</span>
                </label>
                <label class="csv__mode-option" for="modePolygon">
                  <input type="radio" name="processingMode" id="modePolygon" value="polygon" disabled />
                  <span>Полігони</span>
                </label>
              </div>
            </div>
            <textarea class="csv__textarea" id="inputText"
              placeholder="Введіть текст зрозвідувального донесення..."></textarea>
          </div>

          <div class="csv__controls">
            <div class="csv__checkbox-toolbar">
              <div class="csv__legend">Вибір колонок</div>
              <div class="csv__checkbox-actions">
                <button class="csv__mini-button" type="button" id="selectAllColumnsButton">Обрати всі</button>
                <button class="csv__mini-button csv__mini-button--secondary" type="button" id="clearAllColumnsButton">Очистити всі</button>
                <button class="csv__mini-button csv__mini-button--tertiary" type="button" id="saveDefaultColumnsButton">Зберегти дефолт</button>
              </div>
            </div>
            <fieldset class="csv__checkboxes" id="columnsCheckboxes" aria-label="Вибір колонок">
            </fieldset>
          </div>
        </div>

        <div class="csv__actions">
                    <div class="csv__geometry-select">
            <label class="csv__geometry-label" for="sidcDefaultSelect">
              SIDC
              <a class="csv__field-link" href="https://kmzmap.com/uk?mode=mil-signs" target="_blank" rel="noopener noreferrer">
                <span>kmz-довідник</span> 
                <img class="csv__field-link-icon" src="icons/external-link.svg" alt="" aria-hidden="true" />
              </a>
            </label>
            <div class="csv__sidc-select" id="sidcDefaultSelect">
              <button class="csv__sidc-select-trigger" id="sidcSelectButton" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
              <div class="csv__sidc-options" id="sidcSelectOptions" role="listbox" aria-label="SIDC опції"></div>
            </div>
            <label class="csv__sidc-probable" for="sidcProbableCheckbox">
              <input type="checkbox" id="sidcProbableCheckbox" />
              <span>імовірний</span>
            </label>
          </div>
          <div class="csv__geometry-select">
            <label class="csv__geometry-label" for="nameDefaultSelect">Назва</label>
            <div class="csv__name-input-slot">
              <select class="csv__geometry-select-input csv__name-select" id="nameDefaultSelect"></select>
              <div class="csv__name-custom-input" id="nameCustomInputWrap">
                <input class="csv__geometry-select-input" type="text" id="nameCustomInput" placeholder="Введіть назву" />
              </div>
            </div>
            <label class="csv__name-custom-toggle" for="nameCustomToggle">
              <input type="checkbox" id="nameCustomToggle" />
              <span>створити назву</span>
            </label>
          </div>
          
          <div class="csv__geometry-select">
            <label class="csv__geometry-label" for="sourceTypeDefaultSelect">Тип джерела</label>
            <select class="csv__geometry-select-input" id="sourceTypeDefaultSelect"></select>
          </div>
          
          <div class="csv__geometry-select">
            <label class="csv__geometry-label" for="geometryDefaultSelect">Вид об'єкта</label>
            <select class="csv__geometry-select-input" id="geometryDefaultSelect"></select>
          </div>

          <div class="csv__geometry-select">
            <label class="csv__geometry-label" for="higherFormationDefaultSelect">Вище формування</label>
            <div class="csv__higher-formation-input-slot">
              <select class="csv__geometry-select-input csv__higher-formation-select" id="higherFormationDefaultSelect"></select>
              <div class="csv__higher-formation-custom-input" id="higherFormationCustomInputWrap">
                <input class="csv__geometry-select-input" type="text" id="higherFormationCustomInput" placeholder="Введіть вище формування" />
              </div>
            </div>
            <label class="csv__higher-formation-custom-toggle" for="higherFormationCustomToggle">
              <input type="checkbox" id="higherFormationCustomToggle" />
              <span>вказати інше формування</span>
            </label>
          </div>

          <div class="csv__action-buttons">
            <button class="csv__button  csv__button--secondary csv__button--prepare" type="button" id="prepareButton">Підготувати таблицю</button>
            <button class="csv__button" type="button" id="exportButton">Експортувати в csv з назвою -></button>
            <div class="csv__export-name">
              <input class="csv__table-input" type="text" id="exportFileNameInput" />
            </div>
          </div>
        </div>

        <div class="csv__table-wrap">
          <table class="csv__table" id="outputTable">
            <thead class="csv__table-header">
              <tr class="csv__table-header-row" id="tableHeaderRow"></tr>
            </thead>
            <tbody class="csv__table-body"></tbody>
          </table>
        </div>
      </form>
    </div>
    <footer class="csv__footer">
      created by<a href="mailto:f.chopin.1.3.1810@gmail.com">&nbsp;chopin&nbsp;</a>2026 ©
    </footer>
  </article>

  <template id="csvModalTemplate">
    <div class="csv__modal" data-modal-root>
      <div class="csv__modal-backdrop" data-modal-backdrop></div>
      <section class="csv__modal-card" role="dialog" aria-modal="true" aria-labelledby="csvModalTitle">
        <h2 class="csv__modal-title" id="csvModalTitle" data-modal-title></h2>
        <div class="csv__modal-message" data-modal-message></div>
        <div class="csv__modal-actions">
          <button class="csv__button csv__button--secondary" type="button" data-modal-cancel>Відміна</button>
          <button class="csv__button" type="button" data-modal-confirm>Продовжити</button>
        </div>
      </section>
    </div>
  </template>

  <script src="scripts/consts.js"></script>
  <script src="scripts/helpers.js"></script>
  <script src="scripts/sidc.js"></script>
  <script src="scripts/tableRenderer.js"></script>
  <script src="scripts/export.js"></script>
  <script src="scripts/theme.js"></script>
  <script src="scripts/inputPasteNormalizer.js"></script>
  <script src="scripts/routeMode.js"></script>
  <script src="scripts/polygonMode.js"></script>
  <script src="scripts/processingMode.js"></script>
  <script src="scripts/modal.js"></script>
  <script src="scripts/columnsDefaults.js"></script>
  <script src="scripts/scripts.js"></script>
</body>

</html>
